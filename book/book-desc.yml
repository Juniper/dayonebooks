portal:
  abstract: |
    Filter-Based Forwarding (FBF), also known as Policy-Based Routing (PBR),
    lets you steer traffic based on criteria other than the destination
    address. This Day One book explains how FBF works on MX Series routers
    (AFT) and walks you through common deployment scenarios, from the simple
    single-filter approach to the more granular routing-instance design.

    Every example is based on Junos OS release 24.2 and comes with the full
    configuration and the operational commands to verify it.
  highlights:
    - How the ingress lookup is altered by a firewall filter
    - Redirecting traffic to a next-hop or a routing instance
    - Verification and troubleshooting commands
