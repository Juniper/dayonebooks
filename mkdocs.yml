copyright: '&copy; Hewlett Packard Enterprise Development LP. Maintained by HPE Networking
  engineers. Built with Material for MkDocs &amp; Pandoc.'
docs_dir: docs
extra:
  generator: false
  social:
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/hewlett-packard-enterprise
    name: HPE on LinkedIn
  - icon: fontawesome/brands/github
    link: https://github.com/HewlettPackard
    name: HPE on GitHub
extra_css:
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/katex.min.css
- https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css
- stylesheets/extra.css
extra_javascript:
- https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/katex.min.js
- https://cdn.jsdelivr.net/npm/katex@0.15.2/dist/contrib/auto-render.min.js
- https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js
- js/math-render.js
- js/extra.js
markdown_extensions:
- attr_list
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.extra
- markdown_katex
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.highlight:
    anchor_linenums: true
    guess_lang: false
    linenums: true
nav:
- Home: index.md
- The Book:
  - The Sample Day One Book:
    - Introduction: book/chapter1.md
    - FBF Use Case 1: book/chapter2.md
    - FBF use Case 2: book/chapter3.md
- About us: about.md
plugins:
- caption-per-book
- book-enumerate
- search:
    separator: '[\s\-\_]'
- minify:
    minify_html: true
site_author: HPE Networking TME Team
site_name: Day One Books by HPE Networking
theme:
  favicon: images/favicon.ico
  features:
  - toc.follow
  - navigation.top
  - navigation.instant
  - navigation.footer
  - navigation.indexes
  - search.suggest
  - content.code.annotate
  - content.code.copy
  - content.code.select
  - content.action.edit
  - content.tooltips
  - content.footnote.tooltips
  custom_dir: overrides
  font:
    code: JetBrains Mono
    text: Inter
  language: en
  logo: images/hpe-networking.png
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
